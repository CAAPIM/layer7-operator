apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-g2c-agent
  labels:
    app: portal-g2c-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal-g2c-agent
  template:
    metadata:
      labels:
        app: portal-g2c-agent
    spec:
      serviceAccountName: portal-g2c-agent
      hostAliases:
      - ip: "10.96.228.133"
        hostnames:
        - "dev-portal-enroll.brcmlabs.com"
        - "dev-portal-broker.brcmlabs.com"
        - "dev-portal-ssg.brcmlabs.com"
      containers:
      - name: portal-g2c-agent
        image: caapim/portal-g2c-agent:5.3.3
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 100m
            memory: 20Mi
          limits:
            cpu: 200m
            memory: 50Mi
        envFrom:
        - configMapRef:
            name: g2c-agent-configmap
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # BROKER_TYPE selects the message transport: "mqtt" (default) or "kafka".
        # Uncomment and set to "kafka" to enable the Kafka consumer path.
        # - name: BROKER_TYPE
        #   value: "kafka"
        # KAFKA_BOOTSTRAP_SERVERS is the comma-separated list of Kafka broker addresses.
        # Required when BROKER_TYPE=kafka and the enrollment bundle does not supply
        # portal.config.kafka.bootstrap.servers, e.g. "kafka:9092".
        # - name: KAFKA_BOOTSTRAP_SERVERS
        #   value: "kafka:9092"
        # KAFKA_TLS_ENABLED=true mounts the Portal Kafka CA cert into /tmp/agent/kafka-ca.crt
        # and enables TLS for the Kafka connection.
        # - name: KAFKA_TLS_ENABLED
        #   value: "true"
        volumeMounts:
          - name: tmp-dir
            mountPath: /tmp/agent
      volumes:
      - name: tmp-dir
        emptyDir: {}
