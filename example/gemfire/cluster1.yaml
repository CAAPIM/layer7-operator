apiVersion: gemfire.vmware.com/v1
kind: GemFireCluster
metadata:
  name: cluster1
spec:
  image: apim-docker-dev-local.usw1.packages.broadcom.com/gemfire/gemfire:10.1.3-jdk21
  security:
    tls: {}
  locators:
    replicas: 2
  servers:
    replicas: 2
---
# The operator's own governing services for the locator/server StatefulSets are
# headless (clusterIP: None), used for per-pod DNS. These ClusterIP services give
# other in-cluster services a single, stable address/DNS name to resolve instead.
apiVersion: v1
kind: Service
metadata:
  name: cluster1-locator-clusterip
spec:
  type: ClusterIP
  selector:
    gemfire.vmware.com/app: cluster1-locator
  ports:
    - name: locator
      port: 10334
      targetPort: 10334
---
apiVersion: v1
kind: Service
metadata:
  name: cluster1-server-clusterip
spec:
  type: ClusterIP
  selector:
    gemfire.vmware.com/app: cluster1-server
  ports:
    - name: cache-server
      port: 40404
      targetPort: 40404
