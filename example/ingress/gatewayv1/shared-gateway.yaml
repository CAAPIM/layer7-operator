apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      hostname: gateway.brcmlabs.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: gateway-listener-tls
      allowedRoutes:
        namespaces:
          from: Same
