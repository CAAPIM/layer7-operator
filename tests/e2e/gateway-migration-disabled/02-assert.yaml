apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 60
commands:
  - script: |
      # Assert: the Job created in step 01 has been deleted now that
      # migrationJob.enabled=false. Without this check, a regression that
      # left the Job orphaned when migration is disabled after having been
      # enabled would pass silently — this is the exact scenario the
      # "!migrationEnabled" cleanup branch in GatewayMigrationJob exists for.
      if kubectl get job ssg-migration-disabled-db-migration -n "$NAMESPACE" >/dev/null 2>&1; then
        echo "FAIL: Job should have been deleted after migrationJob.enabled was toggled back to false"
        exit 1
      fi

      echo "PASS: orphaned Job was cleaned up"
---
# Assert: the Deployment keeps reconciling normally after the toggle —
# disabling migration does not disturb the Deployment already created in
# step 00.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssg-migration-disabled
spec:
  template:
    spec:
      containers:
      - name: gateway
        image: docker.io/caapim/gateway:11.2.1
