# Step 01: flip migrationJob.enabled to true on the same Gateway.
#
# This exists purely to give step 02 a real Job to clean up — testing the
# disable path against a Gateway that never had a Job (step 00) does not
# exercise GatewayMigrationJob's "!migrationEnabled" orphan-cleanup branch
# at all, since there is nothing to delete.
apiVersion: security.brcmlabs.com/v1
kind: Gateway
metadata:
  name: ssg-migration-disabled
spec:
  version: "11.2.1"
  license:
    accept: true
    secretName: gateway-license
  app:
    replicas: 1
    image: docker.io/caapim/gateway:11.2.1
    imagePullPolicy: IfNotPresent
    management:
      cluster:
        hostname: gateway.brcmlabs.com
      username: admin
      password: 7layer
      database:
        enabled: true
        jdbcUrl: jdbc:mysql://no-mysql.local:3306/ssg
        migrationJob:
          enabled: true   # ← toggled on
    service:
      enabled: true
      type: ClusterIP
      ports:
        - name: https
          port: 8443
          targetPort: 8443
        - name: management
          port: 9443
          targetPort: 9443
